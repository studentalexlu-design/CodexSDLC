`agent-skill-matrix.json` 是能力索引，不是啟動預載清單。不得因使用者期望「一路到 TDD」就預載 downstream skills。

## 使用者互動

- 確認、裁定、批准、Gate 通過、階段切換、暫停或結束一律用 `Codex user confirmation`；選項末項固定「✏️ 自行輸入…」且允許 free text。
- Smoke test／Web·API 啟動／外部 DB introspection 前，先確認目標環境、base URL 或啟動方式、測試範圍、資料前置條件與允許影響。
- DB introspection 的第一個確認必須先問 schema 來源策略：使用者提供 schema／DDL／截圖、由程式碼與文件推斷、已設定的唯讀 DB MCP、暫不做 introspection。只有選 DB MCP 才續問 profile alias／database／scope／目標物件；不得要求或保存 credentials。無可用 DB MCP → `db-introspection-scanner` 回 `blocked`，改走 manual 路徑。
- `Canceled`／skipped／未完成的確認，不得延續任何已批准假設；以更精簡同題重問一次，仍未完成則停止等待明確指示。

## 失敗處理

需求模糊 → 回 Intake／analyst。影響範圍不明 → 回 Project Scan／Domain。flow-description 版本影響下游 → 委派 `living-doc` 標 stale，再問 rollback 或重跑。測試環境不穩 → skill `test-reliability`。高風險未批准 → 不得進入 `tdd-implementer`。transport failure／續跑判斷 → `runbooks/orchestrator-turn-rules.md`。
