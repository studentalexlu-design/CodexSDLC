# Project-scoped Codex configuration for the SDLC workflow (v4.0.0).

personality = "friendly"

[features]
hooks = true

[agents]
# `bdd-orchestrator` runs top-level and delegates one level down.
# max_depth = 2 keeps roster subagents from fanning out further — the hooks that
# enforce the handoff contract only fire on spawns the orchestrator itself makes.
max_threads = 5
max_depth = 2
